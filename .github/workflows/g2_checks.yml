name: G2 - verifications avant le premier ordre (rejeu 12 mois, bandes de normalite)

on:
  push:
    branches: [claude/new-session-ylyiq6]
    paths: ['bot/g2_live.py', 'bot/run_g2_check.py', 'bot/multi.py', '.github/workflows/g2_checks.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g2-checks
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install pandas numpy requests pytest
      - run: python -m pytest -q tests
      - name: Rejeu et bandes
        run: python -m bot.run_g2_check
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "bot-research"
          git config user.email "bot-research@users.noreply.github.com"
          git add bot/reports/g2_verifications.md bot/reports/g2_bandes.json || true
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "G2 : verifications $(date -u +%Y-%m-%d)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
