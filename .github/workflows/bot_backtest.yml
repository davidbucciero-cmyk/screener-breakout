name: Bot BTC - tests, secrets et backtest

on:
  push:
    branches: [claude/new-session-ylyiq6]
    paths: ['bot/**', 'tests/test_bot_*.py', '.github/workflows/bot_backtest.yml', '!bot/reports/**']
  workflow_dispatch:

permissions:
  contents: write         # pour enregistrer bot/reports/backtest.md

concurrency:
  group: bot-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas numpy requests pytest

      - name: Tests
        run: python -m pytest -q tests

      - name: Verification des secrets (presence uniquement)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m bot.check_secrets

      - name: Backtest (4 ans de 1h)
        if: always()
        run: python -m bot.run_backtest --years 4

      - name: Enregistrer le rapport
        if: always()
        run: |
          git config user.name "bot-backtest"
          git config user.email "bot-backtest@users.noreply.github.com"
          git add bot/reports/
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Backtest bot : $(date -u +%Y-%m-%d)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
