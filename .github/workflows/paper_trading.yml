name: Compte demo crypto (paper trading)

on:
  schedule:
    - cron: '7 0 * * *'   # chaque jour, juste apres la cloture journaliere Binance (00:00 UTC)
  workflow_dispatch:

permissions:
  contents: write         # pour enregistrer l'etat du compte dans paper_trading/

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Pas de trading du jour
        run: python -m btc_forecast.paper

      - name: Enregistrer l'etat du compte
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "paper-trading-bot@users.noreply.github.com"
          git add paper_trading/
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Compte demo : $(date -u +%Y-%m-%d)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
