name: Bot BTC - couverture des blocs de donnees

on:
  push:
    branches: [claude/new-session-ylyiq6]
    paths: ['bot/blocks.py', 'bot/probe_blocks.py', '.github/workflows/bot_blocks.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-blocks
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install pandas numpy requests
      - name: Recuperation des blocs
        run: python -m bot.probe_blocks
      - name: Enregistrer la couverture et les donnees
        run: |
          git config user.name "bot-research"
          git config user.email "bot-research@users.noreply.github.com"
          git add bot/reports/blocks.md bot/data/
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Blocs de donnees : $(date -u +%Y-%m-%d)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
