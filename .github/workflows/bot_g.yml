name: Bot - ameliorations de G (periode jamais utilisee 2018-2022)

on:
  push:
    branches: [claude/new-session-ylyiq6]
    paths: ['bot/g_variants.py', 'bot/run_g.py', 'bot/multi.py', '.github/workflows/bot_g.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-g
  cancel-in-progress: true

jobs:
  g:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install pandas numpy requests pytest
      - run: python -m pytest -q tests/test_g_variants.py tests/test_bot_multi.py
      - name: Ameliorations de G
        run: python -m bot.run_g
      - name: Enregistrer le rapport
        if: always()
        run: |
          git config user.name "bot-research"
          git config user.email "bot-research@users.noreply.github.com"
          git add bot/reports/g_ameliorations.md || true
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Ameliorations G : rapport $(date -u +%Y-%m-%d)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
