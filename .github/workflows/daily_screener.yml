name: Screener Daily Run

on:
  schedule:
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas requests yfinance openbb beautifulsoup4

      - name: Run pipeline
        run: python run_all.py

      - name: Upload database
        uses: actions/upload-artifact@v4
        with:
          name: screener-db-${{ github.run_id }}
          path: screener/data/screener.db
          retention-days: 7

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-logs-${{ github.run_id }}
          path: screener/logs/
          retention-days: 30