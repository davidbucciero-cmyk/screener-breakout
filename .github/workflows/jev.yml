name: Jev test

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://api.typesafe.ai/v1/systemone \
            -H "Authorization: Bearer ${{ secrets.TYPESAFE_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"model":"jev-latest","state":"Amazon shares fell 4% after weak guidance; the VIX rose to 24.","questions":{"regime":{"type":"choice","instructions":"Quel regime de marche ?","criteria":{"haussier_calme":"hausse, faible volatilite","haussier_volatil":"hausse, forte volatilite","baissier_calme":"baisse, faible volatilite","baissier_volatil":"baisse, forte volatilite"}}}}'
