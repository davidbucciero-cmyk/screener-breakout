name: G2 paper trading (Alpaca paper, 3 enveloppes)

on:
  schedule:
    - cron: '10 0 * * *'   # chaque jour, apres la cloture quotidienne (00:00 UTC)
  workflow_dispatch:

permissions:
  contents: write          # etat et journal dans paper_g2/
  issues: write            # validation des ordres > 5 000 $

concurrency:
  group: paper-g2
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install pandas numpy requests pytest
      - name: Tests (aucun ordre si un test echoue)
        run: python -m pytest -q tests/test_g2_live.py tests/test_paper_g2.py
      - name: Journee de trading
        run: python -m bot.paper_g2
      - name: Enregistrer l'etat
        if: always()
        run: |
          git config user.name "paper-g2-bot"
          git config user.email "paper-g2-bot@users.noreply.github.com"
          git add paper_g2/ || true
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Paper G2 : $(date -u +%Y-%m-%d)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
