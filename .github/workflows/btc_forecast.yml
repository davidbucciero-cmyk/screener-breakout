name: BTC 1h Forecast

on:
  workflow_dispatch:
    inputs:
      engine:
        description: 'chronos (modele de fondation) ou enkf (assimilation d ensemble, methode meteo)'
        default: 'enkf'
        type: choice
        options: [enkf, chronos]
      command:
        description: 'backtest (1h), predict (1h), trend (quotidien) ou portfolio (plusieurs cryptos)'
        default: 'backtest'
        type: choice
        options: [backtest, predict, trend, portfolio]
      symbol:
        description: 'Paire Binance (trend) ou liste separee par des virgules (portfolio)'
        default: 'BTCUSDT'
      n_test:
        description: 'Nb de previsions walk-forward (backtest)'
        default: '2000'
      fee_bps:
        description: 'Frais par cote en bps (vide = 5 en 1h, 10 en trend)'
        default: ''
      model:
        description: 'Modele HuggingFace (chronos uniquement)'
        default: 'amazon/chronos-bolt-small'

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pandas numpy requests pytest yfinance
          if [ "${{ inputs.engine }}" = "chronos" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install -r btc_forecast/requirements.txt
          fi

      - name: Tests
        run: python -m pytest tests -q

      - name: Cache HuggingFace
        if: inputs.engine == 'chronos'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ inputs.model }}

      - name: Run
        run: >
          python -m btc_forecast.run ${{ inputs.command }}
          --engine ${{ inputs.engine }}
          --model "${{ inputs.model }}"
          --n-test ${{ inputs.n_test }}
          --symbol ${{ inputs.symbol }}
          ${{ inputs.fee_bps && format('--fee-bps {0}', inputs.fee_bps) || '' }}

      - name: Upload report
        if: inputs.command != 'predict'
        uses: actions/upload-artifact@v4
        with:
          name: forecast-${{ inputs.command }}-${{ github.run_id }}
          path: btc_forecast/output/
          retention-days: 30
